x-log: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-image: &ems-image
  image: ems-app:local
  build:
    context: .
    args:
      EMS_SOURCE_REVISION: ${EMS_SOURCE_REVISION:-unknown}

services:
  database:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    env_file: .ems/database.env
    volumes:
      - postgres:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 1g
    logging: *logging

  migrations:
    image: ems-migrations:local
    build:
      context: .
      target: migration-runner
    env_file: .ems/database.env
    depends_on:
      database: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging

  delivery:
    <<: *ems-image
    env_file: .ems/worker.env
    command: ["node", "worker.mjs"]
    depends_on:
      migrations: { condition: service_completed_successfully }
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    logging: *logging

  engineering-portal:
    <<: *ems-image
    env_file: .ems/runtime.env
    ports: ["127.0.0.1:8088:3000"]
    depends_on:
      migrations: { condition: service_completed_successfully }
      delivery: { condition: service_started }
    networks: [frontend, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ems/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 16
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    logging: *logging

  edge-fixture:
    profiles: [edge-test]
    build:
      context: .
      dockerfile: edge/Dockerfile
    environment:
      EMS_EDGE_FIXTURE: "1"
      EMS_EDGE_HOST: "0.0.0.0"
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - edge-fixture:/data
    networks: [edge-fixture]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

volumes:
  postgres:
  edge-fixture:

networks:
  frontend:
  data:
    internal: true
  edge-fixture:
